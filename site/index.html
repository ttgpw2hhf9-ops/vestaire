<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15233a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Vestiaire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<title>Le Vestiaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}

/* Layout: phone-first single column — app bar, sport tabs + team chips, scrolling screen, bottom tab bar; message opens as a full-screen sheet. On a desktop the same phone column is centred. */
:root{
  --outer:#dfe4ec; --bg:#eef1f5; --panel:#ffffff; --panel-2:#f4f6f9; --line:#dde2ea;
  --fg:#16202e; --muted:#5d6b7e; --accent:#1f5fd1; --accent-ink:#ffffff;
  --bar:#15233a; --bar-fg:#eef2f8; --bar-muted:#93a2b8;
  --win:#1f8a4c; --loss:#c33a3a; --draw:#8a8f99; --warn:#b7791f;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --outer:#070b12; --bg:#0e1522; --panel:#152033; --panel-2:#1a273c; --line:#26354d;
  --fg:#e6ecf5; --muted:#93a1b6; --accent:#5b8ff0; --accent-ink:#0b1220;
  --bar:#0a111c; --bar-fg:#e6ecf5; --bar-muted:#7d8ba1;
  --win:#3fb56f; --loss:#e06363; --draw:#8d95a3; --warn:#e0a54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --outer:#070b12; --bg:#0e1522; --panel:#152033; --panel-2:#1a273c; --line:#26354d;
  --fg:#e6ecf5; --muted:#93a1b6; --accent:#5b8ff0; --accent-ink:#0b1220;
  --bar:#0a111c; --bar-fg:#e6ecf5; --bar-muted:#7d8ba1;
  --win:#3fb56f; --loss:#e06363; --draw:#8d95a3; --warn:#e0a54a; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--outer);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{position:relative;display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.18)}}

/* app bar */
.top{background:var(--bar);color:var(--bar-fg);flex:none}
.appbar{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.brand{flex:1;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:.04em;text-transform:none;color:var(--bar-muted);margin-left:6px;vertical-align:middle}
.spoil{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:18px;background:rgba(255,255,255,.08);font-size:12px;color:var(--bar-fg)}
.spoil[aria-pressed="true"]{background:rgba(255,255,255,.16)}
.spoil svg{width:18px;height:18px}
.spoil{white-space:nowrap;flex:none}
a.spoil{text-decoration:none}
.spoil[hidden]{display:none}
.spoil[disabled]{opacity:.45;cursor:default}
.brand{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:9px;flex:none}
.brand span{overflow:hidden;text-overflow:ellipsis}
.spoil .lbl{display:none}.spoil{padding:0;width:48px;min-height:48px;border-radius:24px;justify-content:center}.spoil svg{width:24px;height:24px}.appbar{gap:12px}
@media (max-width:360px){.brand{font-size:20px}.brand img{width:30px;height:30px}}
.appbar{gap:8px}
.spoil .cnt{font-family:var(--f-mono);font-size:10px;min-width:18px;padding:1px 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);text-align:center}

.sports{display:flex;gap:2px;padding:6px 9px 0;overflow-x:auto;scrollbar-width:none}
.sports::-webkit-scrollbar,.teams::-webkit-scrollbar,.cats::-webkit-scrollbar{display:none}
.sport{flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 7px;border-bottom:3px solid transparent;color:var(--bar-muted);font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.sport[aria-pressed="true"]{color:var(--bar-fg);border-bottom-color:var(--accent)}
.sport .n,.team .n{font-family:var(--f-mono);font-size:9px;font-weight:500;letter-spacing:0;min-width:16px;padding:1px 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);text-align:center}

.teams{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;background:var(--panel);border-bottom:1px solid var(--line)}
.teams:empty{display:none}
.team{flex:none;display:flex;align-items:center;gap:7px;min-height:38px;padding:4px 12px 4px 5px;border-radius:20px;border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.team.allbtn{padding-left:12px}
.team[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.team .crest{width:28px;height:28px;border-radius:50%}

.crest{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:11px;color:#fff;background:linear-gradient(135deg,var(--c1) 0 62%,var(--c2) 62% 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.crest.lg{width:48px;height:48px;border-radius:12px;font-size:18px}

/* screen */
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cats{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:2;background:var(--bg)}
.chip{flex:none;min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 16px 6px}
.msg{display:grid;grid-template-columns:30px 1fr auto;gap:2px 12px;align-items:start;width:100%;text-align:left;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;min-height:64px}
.msg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c1)}
.msg:active{background:var(--panel-2)}
.msg{touch-action:pan-y}
.swipe-bg{position:fixed;z-index:5;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;overflow:hidden;white-space:nowrap;font-weight:600;font-size:14px;background:color-mix(in srgb,var(--accent) 35%,var(--bg));color:var(--fg);pointer-events:none}
.swipe-bg.go{background:var(--accent);color:var(--accent-ink)}
.swipe-bg.swl{justify-content:flex-start;gap:8px;padding:0 0 0 18px;background:color-mix(in srgb,#e0a52e 35%,var(--bg))}
.swipe-bg.swl svg{width:18px;height:18px;flex:none}
.swipe-bg.swl.go{background:#e0a52e;color:#1b1300}
.msg .body{min-width:0}
.msg .from{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg .subj{display:block;margin-top:2px;font-weight:500;line-height:1.3}
.msg.unread .subj{font-weight:700}
.msg time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
/* Non lue : point + heure en couleur au début de la ligne du haut ; lue : heure à droite, estompée */
.msg.unread time{color:var(--accent);font-weight:700}
.msg .from .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none}
.msg .from time{margin-right:2px}
.msg:not(.unread) .subj{color:var(--muted);font-weight:400}
.msg:not(.unread) .crest,.msg:not(.unread) .from{opacity:.55}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.tag{white-space:nowrap;font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.tag.news{color:var(--loss)} .tag.resultat{color:var(--win)} .tag.transfert{color:var(--warn)} .tag.avant-match{color:var(--accent)} .tag.resume{color:var(--fg)} .tag.journal{color:var(--warn)} .tag.lang{color:var(--muted);margin-left:4px} .tag.abo{color:#b8860b}
.empty{padding:32px 16px;color:var(--muted);text-align:center}

.pad{padding:4px 16px 24px}
.h2{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:14px 0 4px}
.lead{color:var(--muted);font-size:13px;margin:0 0 12px}
.sec{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.card h4{margin:0 0 10px;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;gap:12px;align-items:center}
.head .t{font-weight:600}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.comp{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.fixture .side{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;min-width:0}
.fixture .mid{font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.gl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);color:var(--muted)}
.gl:first-of-type{border-top:0}
.gl .w{color:var(--fg);font-weight:700}.gl .r{text-align:right}
.gl .sc{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.gl .sc b{font-weight:500}.gl .sc small{font-family:var(--f-mono);font-size:10px;margin-left:5px}
.sl{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sl:first-of-type{border-top:0}
.sl time{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--accent);padding-top:2px}
.sl .tm{display:flex;flex-direction:column;gap:3px;min-width:0;font-weight:600}
.sl .tm small{font-weight:400;font-size:12px;color:var(--muted)}
.sl .rc{display:flex;flex-direction:column;gap:3px;align-items:flex-end;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.sl.ft{grid-template-columns:30px 1fr;align-items:center}
.sl .tv{display:inline-block;margin-left:4px;padding:0 6px;border-radius:4px;border:1px solid var(--line);font-family:var(--f-mono);font-size:10px;letter-spacing:.03em;color:var(--fg);white-space:nowrap}
.card.gmine{border-color:var(--accent)}.card.gmine h4{display:flex;align-items:center;gap:8px}.card.gmine h4 .crest{width:22px;height:22px;font-size:8px}
.crest.ico{background:var(--panel-2);font-size:17px;box-shadow:inset 0 0 0 1px var(--line)}.crest.ico.lg{font-size:27px}
.fixture .mid small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);margin-top:4px}
.masked{display:inline-block;padding:0 6px;border-radius:4px;background:var(--panel-2);border:1px dashed var(--line);color:var(--muted);font-family:var(--f-mono);font-size:12px;letter-spacing:.1em}
.hidden-note{padding:12px 14px;border-radius:10px;background:var(--panel-2);border:1px dashed var(--line);color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:12px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.form{display:flex;gap:4px}
.form i{font-style:normal;width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:500;color:#fff}
.form .W{background:var(--win)} .form .L{background:var(--loss)} .form .D{background:var(--draw)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions .btn{flex:1 1 auto}
textarea,.field input,.field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit;font-size:16px}
textarea{min-height:90px;margin-top:8px;resize:vertical}
.saved{font-size:13px;color:var(--win);margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-family:var(--f-mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
tr.me td{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:600}
.cal-row{display:grid;grid-template-columns:52px 30px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cal-row .when{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.cal-row .what{min-width:0}
.cal-row .what b{font-weight:600;font-size:14px}
.cal-row .what div{font-size:12px;color:var(--muted)}
.src-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.src-row:first-of-type{border-top:0}
.src-row.off .src-main{opacity:.45}
.src-main{flex:1;min-width:0}
.src-main b{font-weight:600}
.src-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.rel{font-size:11px;color:var(--muted)} .rel.haute{color:var(--win)} .rel.faible{color:var(--warn)}
.keep{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.kbtn{min-height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.kbtn[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.icon-btn{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.icon-btn[disabled]{opacity:.3}
.icon-btn svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.refresh{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.refresh dd{margin:0;font-family:var(--f-mono);font-size:12px}
.demo-note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:16px 0 0}

/* bottom tabs */
.tabbar{flex:none;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);position:relative}
.tabbar button[aria-current="true"]{color:var(--accent);font-weight:600}
.tabbar svg{width:22px;height:22px}
.tabbar .badge{position:absolute;top:6px;left:calc(50% + 6px);font-family:var(--f-mono);font-size:10px;min-width:16px;padding:0 4px;border-radius:8px;background:var(--loss);color:#fff;line-height:16px}

/* message sheet */
.sheet{position:absolute;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:no-preference){.sheet{transition:transform .22s ease,visibility .22s}}
.sheet-bar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 4px;background:var(--panel);border-bottom:1px solid var(--line)}
.back{min-height:44px;padding:0 10px;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:2px}
.back svg{width:20px;height:20px}
.sheet-body{flex:1;overflow-y:auto;padding:16px 16px 32px}
.sheet h2{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.08;margin:14px 0 10px;text-wrap:balance}
.sheet .txt p{margin:0 0 12px}
.save-btn{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--fg)}
.save-btn svg{width:18px;height:18px}
.save-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.msg .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.saved-ico{color:var(--accent);width:16px;height:16px;display:block}
.saved-ico svg{width:16px;height:16px}
.fresh{display:flex;align-items:center;gap:6px;padding:8px 16px 0;font-size:12px;color:var(--muted)}
.fresh svg{width:14px;height:14px;color:var(--win)}
.empty svg{width:36px;height:36px;color:var(--line);display:block;margin:0 auto 8px}
.tabbar .badge.alt{background:var(--accent);color:var(--accent-ink)}
.source{margin-top:16px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.status{display:flex;align-items:flex-start;gap:8px;padding:8px 16px 0;font-size:12px;color:var(--muted)}
.status svg{flex:none;width:14px;height:14px;margin-top:1px}
.status.ok svg{color:var(--win)}
.status.run{color:var(--accent)}
.status.err{color:var(--loss)}
.status .lnk{color:var(--accent);text-decoration:underline;padding:0;font-size:12px}
.status.ok{align-items:center}
.status .refresh-btn:first-of-type{margin-left:auto}.refresh-btn{flex:none;width:34px;height:34px;border-radius:17px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--fg)}.refresh-btn svg{width:16px!important;height:16px!important;margin:0!important;color:var(--fg)!important}
.status [data-allread]{margin-left:auto;white-space:nowrap;min-height:32px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.crest.logo{background:#fff;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.crest.logo img{width:100%;height:100%;object-fit:contain;display:block}
.inline-form{display:flex;flex-direction:column;gap:2px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);margin:4px 0 10px}
.check input{width:20px;height:20px}
.danger{color:var(--loss)}
.txt p{margin:0 0 12px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.subj.masked{color:var(--muted);font-style:italic;font-weight:500}
.subj.masked svg{width:15px;height:15px;vertical-align:-2px;margin-right:5px}
.sport .eye svg{width:13px;height:13px;margin-left:5px;vertical-align:-1px;opacity:.75}
.tgl{flex:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;border:0}

    <div class="sheet-body" id="sheetBody"></div>

<script>
// ===== Vestiaire — version GitHub (sans IA). Lit data.json, mis à jour par GitHub Actions. =====
const CATS={news:"News","avant-match":"Avant-match",resultat:"Résultat",transfert:"Mercato",journal:"Journal"};
const AUTOICO={"NBA":"🏀","MLB":"⚾","Week-end":"⚽","Baseball Cube":"⚾"}; // fiches quotidiennes construites par le robot
const SPORT_ORDER=["Basket","Foot","Baseball","Rugby","F1","Cyclisme"];
const BADGE={Basket:["BSK","#c4561c","#2a2a2a"],Foot:["FOO","#1d7a3e","#e8e8e8"],Baseball:["BSB","#23395d","#b0262c"],Rugby:["RUG","#7a1f2b","#e8e8e8"],F1:["F1","#d0021b","#1a1a1a"],Cyclisme:["VÉLO","#e0a800","#1a1a1a"]};
let D={teams:[],articles:[],teamData:{},sources:[],dataStatus:{},updatedAt:null}, loaded=false, loadErr=null, loading=false;
const ui={view:"inbox",sport:"all",team:"all",cat:"all",open:null};
let P={read:[],saved:[],savedItems:{},order:[],hide:{},rev:[],rt:{},ut:{},st:{},sut:{},ot:0,ht:0,theme:{},log:{},seasons:{}};
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
Object.assign(ui,LS("vh-ui")||{});ui.open=null;Object.assign(P,LS("vh-prefs")||{});
const saveUi=()=>LS("vh-ui",{sport:ui.sport,team:ui.team,view:ui.view});
const saveP=(fromSync)=>{const ids=new Set(D.articles.map(a=>a.id));if(D.articles.length){P.read=P.read.filter(i=>ids.has(i));P.rev=(P.rev||[]).filter(i=>ids.has(i))}if(!fromSync){stamp();syncSoon()}LS("vh-prefs",P)};
// ---- Synchronisation entre appareils (Gist privé GitHub, jeton gardé sur l'appareil) ----
const SYNC_KEY="vh-sync",SYNC_FILE="vestiaire-sync.json";
let syncCfg=LS(SYNC_KEY),syncInfo={busy:false,err:"",at:0},syncTimer=null;
const snapOf=()=>({read:[...P.read],saved:[...P.saved],order:JSON.stringify(P.order||[]),hide:JSON.stringify(P.hide||{})});
let lastSnap=snapOf();
// Note l'heure de chaque changement (lu / non lu, mis de côté / retiré, ordre, scores cachés)
function stamp(){const now=Date.now();for(const k of ["rt","ut","st","sut"])P[k]=P[k]||{};
  const pr=new Set(lastSnap.read),cr=new Set(P.read),alive=new Set(D.articles.map(a=>a.id));
  for(const id of cr)if(!pr.has(id))P.rt[id]=now;
  for(const id of pr)if(!cr.has(id)&&alive.has(id))P.ut[id]=now;
  const ps=new Set(lastSnap.saved),cs=new Set(P.saved);
  for(const id of cs)if(!ps.has(id))P.st[id]=now;
  for(const id of ps)if(!cs.has(id))P.sut[id]=now;
  if(JSON.stringify(P.order||[])!==lastSnap.order)P.ot=now;if(JSON.stringify(P.hide||{})!==lastSnap.hide)P.ht=now;
  lastSnap=snapOf()}
function mergeRemote(R){
  const mx=(a,b)=>{const o={...(a||{})};for(const k in (b||{}))o[k]=Math.max(o[k]||0,b[k]);return o};
  for(const id of P.read)P.rt[id]=P.rt[id]||1;for(const id of P.saved)P.st[id]=P.st[id]||1;
  P.rt=mx(P.rt,R.rt);P.ut=mx(P.ut,R.ut);P.st=mx(P.st,R.st);P.sut=mx(P.sut,R.sut);
  const old=Date.now()-21*864e5;for(const k of ["rt","ut"])for(const id in P[k])if(P[k][id]<old&&P[k][id]>1)delete P[k][id];
  const alive=new Set(D.articles.map(a=>a.id));
  P.read=Object.keys(P.rt).filter(id=>P.rt[id]>(P.ut[id]||0)&&(!D.articles.length||alive.has(id)));
  P.saved=Object.keys(P.st).filter(id=>P.st[id]>(P.sut[id]||0)).sort((x,y)=>P.st[x]-P.st[y]);
  const items={...(R.savedItems||{}),...(P.savedItems||{})};P.savedItems={};for(const id of P.saved)if(items[id])P.savedItems[id]=items[id];
  if((R.ot||0)>(P.ot||0)){P.order=R.order||[];P.ot=R.ot}
  if((R.ht||0)>(P.ht||0)){P.hide=R.hide||{};P.ht=R.ht}
  for(const k of ["theme","log","seasons"])P[k]=mergeT(P[k],R[k]);
  lastSnap=snapOf()}
// Fusion « le plus récent gagne » élément par élément (champ t)
function mergeT(a,b){const o={...(a||{})};for(const k in (b||{}))if(!o[k]||(b[k].t||0)>(o[k].t||0))o[k]=b[k];return o}
const payload=(X=P)=>({v:1,rt:X.rt||{},ut:X.ut||{},st:X.st||{},sut:X.sut||{},savedItems:X.savedItems||{},order:X.order||[],ot:X.ot||0,hide:X.hide||{},ht:X.ht||0,theme:X.theme||{},log:X.log||{},seasons:X.seasons||{}});
async function gh(path,opt={},tok=syncCfg&&syncCfg.token){
  const r=await fetch("https://api.github.com/"+path,{method:opt.method||"GET",cache:"no-store",headers:{"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:opt.body?JSON.stringify(opt.body):undefined});
  if(!r.ok)throw new Error(r.status===401?"jeton refusé ou expiré":r.status===403||r.status===404?"jeton sans le droit « gist »":"GitHub HTTP "+r.status);
  return r.json()}
async function sync(){
  if(!syncCfg||syncInfo.busy)return;syncInfo.busy=true;
  try{
    const g=await gh("gists/"+syncCfg.gist);const f=g.files&&g.files[SYNC_FILE];
    let R={};if(f){const txt=f.truncated?await (await fetch(f.raw_url,{cache:"no-store"})).text():f.content;try{R=JSON.parse(txt||"{}")}catch(e){R={}}}
    stamp();mergeRemote(R);saveP(true);
    await bgDownload(g);
    const out=payload(),same=JSON.stringify(out)===JSON.stringify(payload(R)),files={},pend=LS("vh-bg-pending")||[];
    if(!same)files[SYNC_FILE]={content:JSON.stringify(out)};
    for(const k of pend){const img=LS("vh-bg-"+k);if(img)files[bgFile(k)]={content:img}}
    if(Object.keys(files).length){await gh("gists/"+syncCfg.gist,{method:"PATCH",body:{files}});LS("vh-bg-pending",[])}
    syncInfo.err="";syncInfo.at=Date.now();
  }catch(e){syncInfo.err=e.message}
  syncInfo.busy=false;render()}
function syncSoon(){if(!syncCfg)return;clearTimeout(syncTimer);syncTimer=setTimeout(sync,2500)}
async function syncSetup(tok){
  syncInfo={busy:true,err:"",at:0};render();
  try{
    const list=await gh("gists?per_page=100",{},tok);let g=list.find(x=>x.files&&x.files[SYNC_FILE]);
    if(!g)g=await gh("gists",{method:"POST",body:{description:"Le Vestiaire – synchronisation (lus, à lire, réglages)",public:false,files:{[SYNC_FILE]:{content:"{}"}}}},tok);
    syncCfg={token:tok,gist:g.id};LS(SYNC_KEY,syncCfg);syncInfo.busy=false;await sync();
  }catch(e){syncInfo={busy:false,err:e.message,at:0};render()}}

const $=id=>document.getElementById(id);
const WIDE=()=>matchMedia("(min-width:900px) and (orientation:landscape)").matches;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TEAMS=()=>Object.fromEntries(D.teams.map(t=>[t.key,t]));
function sports(){const s=new Set([...D.teams.map(t=>t.sport),...D.sources.filter(x=>x.scope.startsWith("sport:")).map(x=>x.scope.slice(6))]);return [...SPORT_ORDER.filter(x=>s.has(x)),...[...s].filter(x=>!SPORT_ORDER.includes(x)).sort()]}

function moveTeam(k,dir){const t=TEAMS()[k];const same=teamsOf(t.sport);const i=same.indexOf(k),j=i+dir;if(j<0||j>=same.length)return;

const isSrc=()=>ui.team.startsWith("src:");

const scopeKeys=()=>isTeamSel()?[ui.team]:teamsOf(ui.sport);
// Sites affichés comme une pastille (ex. Passion MLB) : "chip": true dans sources.json
const chipSources=sp=>{const seen=new Set();return D.sources.filter(x=>x.chip&&x.status!=="pause"&&(sp==="all"||x.scope==="sport:"+sp||(TEAMS()[x.scope]&&TEAMS()[x.scope].sport===sp))).filter(x=>!seen.has(x.name)&&seen.add(x.name))};

const TZ="Europe/Paris";
const dayKey=d=>new Date(d).toLocaleDateString("fr-CA",{timeZone:TZ});
function dayLabel(iso){const k=dayKey(iso),t=dayKey(Date.now());if(k===t)return "Aujourd'hui";if(k===dayKey(Date.now()-864e5))return "Hier";if(k===dayKey(Date.now()+864e5))return "Demain";return new Date(iso).toLocaleDateString("fr-FR",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"})}
const hm=iso=>new Date(iso).toLocaleTimeString("fr-FR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});

function crest(key,cls=""){const t=TEAMS()[key];
  const fb=t?`<span class="crest ${cls}" style="--c1:${esc(t.c1)};--c2:${esc(t.c2)}" aria-hidden="true">${esc(t.short)}</span>`:`<span class="crest ${cls}" style="--c1:#55657d;--c2:#8796ad" aria-hidden="true">★</span>`;
  if(!t)return fb;
  return `<span class="crest logo ${cls}" data-fb="${esc(key)}" aria-hidden="true" hidden><img src="logos/${esc(key)}.png" alt="" onload="this.parentNode.hidden=false;this.parentNode.nextElementSibling.remove()" onerror="this.parentNode.remove()"></span>${fb}`}
// Logo d'un site : "logo" dans sources.json (ex. "lequipe" -> logos/src-lequipe.png), sinon nom du site
const srcSlug=n=>{const s=D.sources.find(x=>x.name===n&&x.logo);return s?"src-"+s.logo:srcSlug0(n)};
const srcSlug0=n=>"src-"+n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
// Logo d'un site (logos/src-<nom>.png), sinon pastille en lettres
function srcCrest(name,fb,cls=""){return `<span class="crest logo ${cls}" aria-hidden="true" hidden><img src="logos/${srcSlug(name)}.png" alt="" onload="this.parentNode.hidden=false;this.parentNode.nextElementSibling.remove()" onerror="this.parentNode.remove()"></span>${fb}`}
function aCrest(a,cls=""){if(a.team&&TEAMS()[a.team])return crest(a.team,cls);if(AUTOICO[a.source])return `<span class="crest ico ${cls}" aria-hidden="true">${AUTOICO[a.source]}</span>`;const b=BADGE[a.sport]||[(a.sport||"★").slice(0,3).toUpperCase(),"#55657d","#8796ad"];const fb=`<span class="crest ${cls}" style="--c1:${b[1]};--c2:${b[2]}" aria-hidden="true">${esc(b[0])}</span>`;return D.sources.some(x=>(x.chip||x.logo)&&x.name===a.source)?srcCrest(a.source,fb,cls):fb}
const aColor=a=>{const t=TEAMS()[a.team];return t?t.c1:(BADGE[a.sport]||[0,"#55657d"])[1]};

// Non lus de la sélection affichée (sport/équipe, et catégorie dans l'Inbox)
const visibleUnread=()=>D.articles.filter(a=>!isRead(a.id)&&inScope(a)&&(ui.view!=="inbox"||ui.cat==="all"||a.cat===ui.cat));
// État du robot GitHub (lecture publique, sans jeton) : bloqué / en retard / OK
let robot={state:"",at:0,run:null,since:null},robotTimer=null,robotPrev="";
async function checkRobot(){if(!D.repo)return;
  try{const r=await fetch(`https://api.github.com/repos/${D.repo}/actions/runs?per_page=8`,{cache:"no-store"});if(!r.ok)throw 0;const runs=(await r.json()).workflow_runs||[];
    const now=Date.now(),open=runs.filter(x=>x.status!=="completed"),stuck=open.filter(x=>now-Date.parse(x.created_at)>15*6e4).sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at))[0];
    const lastOk=runs.find(x=>x.conclusion==="success");
    let wf=null;try{const w=await (await fetch(`https://api.github.com/repos/${D.repo}/actions/workflows`,{cache:"no-store"})).json();wf=(w.workflows||[]).find(x=>/update\.ya?ml$/.test(x.path))}catch(e){}
    if(wf&&wf.state&&wf.state!=="active")robot={state:"paused",at:now,run:`https://github.com/${D.repo}/actions`};
    else if(stuck)robot={state:"stuck",run:stuck.html_url,since:stuck.created_at,at:now};
    else if(open.length)robot={state:"running",at:now};
    else if(lastOk&&now-Date.parse(lastOk.updated_at)>150*6e4&&isRobotHours())robot={state:"late",since:lastOk.updated_at,at:now,run:`https://github.com/${D.repo}/actions`};
    else robot={state:"ok",at:now}}
  catch(e){robot={state:"",at:Date.now()}}
  // Tant que le robot tourne : nouvelle vérification toutes les 30 s ; à la fin, rechargement des news
  const was=robotPrev;robotPrev=robot.state;clearTimeout(robotTimer);
  if(robot.state==="running"&&!launch.busy)robotTimer=setTimeout(checkRobot,30e3);
  if(was==="running"&&robot.state!=="running"&&!launch.busy){load(true);return}
  render()}
const isRobotHours=()=>{const h=new Date().getUTCHours();return h>=4&&h<=22};
function statusHtml(){
  if(loadErr&&!loaded)return `<div class="status err">${I.warn}<span>Impossible de charger les news (${esc(loadErr)}). Vérifie ta connexion.</span>${refreshBtn()}</div>`;
  if(!D.updatedAt)return "";
  const bad=robot.state==="stuck"||robot.state==="late"||robot.state==="paused";
  const rb=launch.busy||launch.msg?` · ${esc(launch.msg||"robot en cours…")}`
    :robot.state==="paused"?` · <b>robot mis en pause par GitHub</b>${adm?" · touche ▶ pour le relancer":` · <a class="lnk" href="${esc(robot.run)}" target="_blank" rel="noopener">le réactiver</a>`}`
    :robot.state==="stuck"?` · <b>robot bloqué depuis ${hm(robot.since)}</b> · ${adm?`<button class="lnk" data-unstick="${esc(robot.run)}">le débloquer</button>`:`<a class="lnk" href="${esc(robot.run)}" target="_blank" rel="noopener">le débloquer</a>`}`
    :robot.state==="late"?` · <b>robot en retard</b> (dernier passage ${hm(robot.since)}) · <a class="lnk" href="${esc(robot.run)}" target="_blank" rel="noopener">voir</a>`
    :robot.state==="running"?" · robot en cours de passage":robot.state==="ok"?" · robot OK":"";
  return `<div class="status ${bad?"err":"ok"}">${bad?I.warn:I.check}<span class="st-txt" data-robotcheck="1" role="button" tabindex="0" title="Toucher pour vérifier l'état du robot">Mis à jour ${dayKey(D.updatedAt)===dayKey(Date.now())?"aujourd'hui":esc(dayLabel(D.updatedAt).toLowerCase())} à ${hm(D.updatedAt)}${rb}</span>${refreshBtn()}</div>`;
}

  const u=unread(()=>true),sv=P.saved.length;
  $("tabbar").innerHTML=[["inbox","Inbox"],["saved","À lire"],["cal","Agenda"],["teams","Équipes"],["log","Carnet"]].map(([k,l])=>`<button data-view="${k}" aria-current="${ui.view===k||(k==="log"&&LOGV.includes(ui.view))}">${I[k]}${l}${k==="inbox"&&u?`<span class="badge">${u}</span>`:""}${k==="saved"&&sv?`<span class="badge alt">${sv}</span>`:""}</button>`).join("");
}
function row(a){const m=isMasked(a),t=TEAMS()[a.team];return `<button class="msg ${isRead(a.id)?"":"unread"}${ui.open===a.id?" sel":""}" data-msg="${esc(a.id)}" ${m?'data-masked="1"':""} style="--c1:${esc(aColor(a))}">${aCrest(a)}
  <span class="body"><span class="from">${isRead(a.id)?"":`<span class="dot" aria-hidden="true"></span><span class="vh">Non lu</span><time>${hm(a.publishedAt)}</time>`}${esc(a.source)} <span class="tag ${esc(a.cat)}">${esc(CATS[a.cat]||a.cat)}</span></span>${m?`<span class="subj masked">${I.eye}${t?esc(t.label||t.name)+" : r":"R"}ésultat caché · touche pour l'afficher</span>`:`<span class="subj">${esc(a.title)}</span>`}</span>

function grouped(list){let h="",last="";for(const a of list){const k=dayKey(a.publishedAt);if(k!==last){h+=`<div class="day">${esc(dayLabel(a.publishedAt))}</div>`;last=k}h+=row(a)}return h}
function renderInbox(){

  if(!list.length)return h+`<p class="empty">Rien dans cette sélection pour l'instant.</p>`;
  return h+grouped(list);
}
function renderSaved(){
  const list=allArts().filter(a=>isSaved(a.id)).sort((a,b)=>Date.parse(b.publishedAt)-Date.parse(a.publishedAt));
  const h=`<div class="pad" style="padding-bottom:0"><h2 class="h2">À lire</h2><p class="lead">Les articles mis de côté, gardés sur cet appareil.</p></div>`;

function renderCal(){
  const T=TEAMS(),rows=[];
  const seen=new Set();
  scopeKeys().forEach(k=>((D.teamData[k]||{}).next||[]).forEach(g=>{if(g.id&&seen.has(g.id))return;seen.add(g.id);if(Date.parse(g.date)>Date.now()-3*36e5)rows.push({...g,team:k})}));
  rows.sort((a,b)=>Date.parse(a.date)-Date.parse(b.date));
  let h=`<div class="pad"><h2 class="h2">Agenda</h2><p class="lead">Heure de Paris.</p>`;
  if(!rows.length)return h+`<p class="empty">Aucun match connu pour cette sélection.</p></div>`;
  let last="";for(const g of rows){const k=dayKey(g.date);if(k!==last){h+=`<div class="sec">${esc(dayLabel(g.date))}</div>`;last=k}
    const me=T[g.team].label||T[g.team].name;h+=`<div class="cal-row"><div class="when">${hm(g.date)}</div>${crest(g.team)}<div class="what"><b>${esc(g.label?g.opp:g.home?me+" – "+g.opp:g.opp+" – "+me)}</b><div>${esc(g.comp||"")}</div></div></div>`}
  return h+`</div>`;
}

  const st=d.standings,lg=(d.last||[])[0],hid=hideOn(k,t.sport)&&!(ui.revT||{})[k];

   <dl class="kv"><dt>Prochain</dt><dd>${nx?`${nx.label?esc(nx.label):(nx.home?"vs ":"@ ")+esc(nx.opp)}<br><span class="comp">${esc(dayLabel(nx.date))} · ${hm(nx.date)}${nx.comp&&!nx.label?" · "+esc(nx.comp):""}</span>`:`<span class="comp">pas encore connu</span>`}</dd>

document.addEventListener("touchmove",e=>{if(!sw)return;const t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(!sw.lock){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;if(Math.abs(dy)>=Math.abs(dx)){sw=null;return}
    const dir=dx<0?-1:1;
    if(dir<0&&!sw.el.classList.contains("unread")){sw=null;return} // gauche : seulement les non lues
    if(dir>0&&(ui.view==="saved"||isSaved(sw.el.dataset.msg))){sw=null;return} // droite : rien si déjà mise de côté
    sw.lock=1;sw.dir=dir;sw.bg=document.createElement("div");sw.bg.className="swipe-bg"+(dir>0?" swl":"");
    if(dir>0)sw.bg.innerHTML=I.bmkFill+"<span>À lire</span>";else sw.bg.textContent="\u2713 Lu";document.body.appendChild(sw.bg)}
  e.preventDefault();sw.dx=sw.dir<0?Math.min(0,dx):Math.max(0,dx);const r0=sw.el.getBoundingClientRect(),w=Math.abs(sw.dx),left0=r0.left-(parseFloat(sw.el.dataset.swx)||0);
  sw.el.style.transform=`translateX(${sw.dx}px)`;sw.el.dataset.swx=sw.dx;
  Object.assign(sw.bg.style,{top:r0.top+"px",height:r0.height+"px",left:(sw.dir<0?left0+r0.width-w:left0)+"px",width:w+"px"});sw.bg.classList.toggle("go",w>=SW_MIN)},{passive:false});
document.addEventListener("touchend",()=>{if(!sw)return;if(!sw.lock){sw=null;return}swAt=Date.now();const ok=Math.abs(sw.dx)>=SW_MIN,id=sw.el.dataset.msg,dir=sw.dir;delete sw.el.dataset.swx;

const CS=["Foot","Basket","Baseball","Rugby"],CSI={Foot:"⚽",Basket:"🏀",Baseball:"⚾",Rugby:"🏉"};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toLocaleDateString("fr-CA",{timeZone:TZ});
const fdate=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const entries=()=>Object.values(P.log||{}).filter(e=>!e.del);
const seasonsOf=sp=>Object.values(P.seasons||{}).filter(s=>!s.del&&s.sport===sp).sort((a,b)=>a.start.localeCompare(b.start));
function ensureSeasons(){let ch=false;const y=+today().slice(0,4),m=+today().slice(5,7),sy=m>=7?y:y-1;
  for(const sp of CS)if(!seasonsOf(sp).length){const base=sp==="Baseball";const id=`def-${sp}-${base?y:sy}`;
    P.seasons={...(P.seasons||{}),[id]:{id,sport:sp,name:base?String(y):`${sy}-${String(sy+1).slice(2)}`,start:base?`${y}-01-01`:`${sy}-07-01`,closed:false,t:1}};ch=true}
  if(ch)saveP(true)}
const currentSeason=sp=>{const l=seasonsOf(sp).filter(s=>!s.closed);return l[l.length-1]||null};
const seasonOfEntry=e=>{const l=seasonsOf(e.sport).filter(s=>s.start<=e.date);return l[l.length-1]||seasonsOf(e.sport)[0]||null};
const inSeason=(e,sid)=>(seasonOfEntry(e)||{}).id===sid;
const isCurrent=e=>{const s=seasonOfEntry(e),c=currentSeason(e.sport);return s&&c&&s.id===c.id};
function resultOf(e){if(!e.team||e.hs===""||e.as===""||e.hs==null)return null;const a=+(e.side==="away"?e.as:e.hs),b=+(e.side==="away"?e.hs:e.as);return a>b?"W":a<b?"L":"D"}
const RL={W:["V","var(--win)"],L:["D","var(--loss)"],D:["N","var(--draw)"]};
function stars(r,cls=""){const f=Math.floor(r||0),h=(r||0)-f>=.5;return `<span class="st ${cls}" aria-label="${String(r||0).replace(".",",")} sur 5">${"★".repeat(f)}${h?'<span class="hs">★</span>':""}</span>`}
const fmtN=x=>String(Math.round(x*10)/10).replace(".",",");
function stats(list){const o={n:list.length,avg:0,stade:0,tele:0,W:0,D:0,L:0,best:null,teams:{},opp:{},bySport:{}};let sum=0,nr=0;
  for(const e of list){if(e.rating){sum+=e.rating;nr++}if(e.how==="stade")o.stade++;else o.tele++;const r=resultOf(e);if(r)o[r]++;
    o.bySport[e.sport]=(o.bySport[e.sport]||0)+1;
    if(!o.best||(e.rating||0)>(o.best.rating||0))o.best=e;
    if(e.team){const T=o.teams[e.team]=o.teams[e.team]||{n:0,W:0,D:0,L:0,sum:0,nr:0};T.n++;if(r)T[r]++;if(e.rating){T.sum+=e.rating;T.nr++}
      const opp=e.side==="away"?e.home:e.away;if(opp)o.opp[opp]=(o.opp[opp]||0)+1}}
  o.avg=nr?sum/nr:0;return o}
const bil=(x,sp)=>sp==="Foot"||sp==="Rugby"||sp===undefined?`${x.W}-${x.D}-${x.L}`:`${x.W}-${x.L}`;
const title=e=>`${e.home||"?"} ${e.hs!==""&&e.hs!=null?e.hs+"-"+e.as:"–"} ${e.away||"?"}`;
function entryCard(e){const r=resultOf(e);return `<button class="card log-row" data-logedit="${esc(e.id)}"><div class="row">${e.team?crest(e.team):`<span class="crest" style="--c1:#3a4a63;--c2:#5b6f8f" aria-hidden="true">${CSI[e.sport]||"★"}</span>`}<div class="lmain"><b>${esc(title(e))}</b>${r?` <b style="color:${RL[r][1]}">${RL[r][0]}</b>`:""}<div class="muted">${esc(fdate(e.date))}${e.comp?" · "+esc(e.comp):""} · ${e.how==="stade"?"Au stade":"Télé"}</div></div><span class="scol">${stars(e.rating)}</span></div>${e.note?`<div class="muted quote">« ${esc(e.note.length>90?e.note.slice(0,88)+"…":e.note)} »</div>`:""}</button>`}
// Recherche par équipe : mon équipe ou l'adversaire, sans majuscules ni accents
const nrm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
let logCur=[];
function logListHtml(list){const srt=ui.logSort==="note"?"note":"date",q=nrm(ui.logQ),T=TEAMS();let h="";
  if(q){list=list.filter(e=>{const t=T[e.team];return nrm([e.home,e.away,t&&t.name,t&&t.label].join(" ")).includes(q)});
    const lab=esc((ui.logQ||"").trim());h+=`<p class="muted" style="margin:0 16px 10px">${list.length?`${list.length} match${list.length>1?"s":""} avec « ${lab} »`:`Aucun match avec « ${lab} ».`}</p>`}
  list=list.slice().sort(srt==="note"?(a,b)=>(b.rating||0)-(a.rating||0)||b.date.localeCompare(a.date):(a,b)=>b.date.localeCompare(a.date)||(b.t||0)-(a.t||0));
  let last="";for(const e of list){const m=srt==="date"?new Date(e.date+"T12:00:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"}):"";if(m&&m!==last){h+=`<div class="day">${esc(m)}</div>`;last=m}h+=entryCard(e)}
  return h}
function renderLog(){ensureSeasons();

function suggestions(){const out=[],T=TEAMS(),seen=new Set(entries().map(e=>e.team+"|"+e.date));
  for(const t of D.teams){if(!CS.includes(t.sport))continue;for(const g of ((D.teamData||{})[t.key]||{}).last||[]){if(!g.score||Date.now()-Date.parse(g.date)>14*864e5)continue;
    const [a,b]=g.score.split("-"),me=t.label||t.name,date=new Date(g.date).toLocaleDateString("fr-CA",{timeZone:TZ});if(seen.has(t.key+"|"+date))continue;
    out.push({sport:t.sport,team:t.key,side:g.home?"home":"away",home:g.home?me:g.opp,away:g.home?g.opp:me,hs:g.home?a:b,as:g.home?b:a,date,comp:g.comp||t.comp||""})}}
  return out.sort((x,y)=>y.date.localeCompare(x.date)).slice(0,6)}

function renderCompare(){ensureSeasons();const sp=ui.cmpSport||"Foot",all=seasonsOf(sp).slice().reverse();
  const A=P.seasons[ui.cmpA]&&P.seasons[ui.cmpA].sport===sp?P.seasons[ui.cmpA]:all[0],B=P.seasons[ui.cmpB]&&P.seasons[ui.cmpB].sport===sp?P.seasons[ui.cmpB]:all[1];
  let h=`<div class="pad"><div style="display:flex;align-items:center;gap:8px"><h2 class="h2" style="flex:1;margin:0">Comparer</h2><button class="btn sm" data-view="log">Carnet</button></div>
  <div class="chips" style="margin-top:12px">${CS.map(s=>`<button class="chip" data-cmpsport="${s}" aria-pressed="${s===sp}">${s}</button>`).join("")}</div>`;
  if(all.length<2)return h+`<p class="empty">Il faut au moins deux saisons de ${esc(sp.toLowerCase())} pour comparer. La comparaison sera disponible après ta première clôture.</p></div>`;
  const sel=(id,v)=>`<select class="chip sel" id="${id}">${all.map(s=>`<option value="${esc(s.id)}" ${s.id===v.id?"selected":""}>${esc(s.name)}${s.closed?"":" (en cours)"}</option>`).join("")}</select>`;
  const la=entries().filter(e=>inSeason(e,A.id)),lb=entries().filter(e=>inSeason(e,B.id)),a=stats(la),b=stats(lb),pct=x=>{const g=x.W+x.D+x.L;return g?Math.round(100*x.W/g)+" %":"–"};
  h+=`<div class="chips" style="margin-top:8px">${sel("cmpA",A)}<span class="muted" style="align-self:center">vs</span>${sel("cmpB",B)}</div>
  <div class="card" style="margin-top:12px"><table class="cmp"><thead><tr><th></th><th class="ca">${esc(A.name)}</th><th class="cb">${esc(B.name)}</th></tr></thead><tbody>
  <tr><td>Matchs vus</td><td><b>${a.n}</b></td><td>${b.n}</td></tr><tr><td>Note moyenne</td><td><b>${a.n?"★ "+fmtN(a.avg):"–"}</b></td><td>${b.n?"★ "+fmtN(b.avg):"–"}</td></tr>
  <tr><td>Au stade</td><td><b>${a.stade}</b></td><td>${b.stade}</td></tr><tr><td>À la télé</td><td><b>${a.tele}</b></td><td>${b.tele}</td></tr>
  <tr><td>Bilan de tes équipes</td><td><b>${bil(a,sp)}</b></td><td>${bil(b,sp)}</td></tr><tr><td>% de victoires</td><td><b>${pct(a)}</b></td><td>${pct(b)}</td></tr></tbody></table></div>`;
  // matchs par mois, depuis le début de chaque saison
  const mo=(l,s)=>{const c=Array(12).fill(0),s0=+s.start.slice(0,4)*12+ +s.start.slice(5,7)-1;for(const e of l){const i=+e.date.slice(0,4)*12+ +e.date.slice(5,7)-1-s0;if(i>=0&&i<12)c[i]++}return c};
  const ma=mo(la,A),mb=mo(lb,B),mx=Math.max(1,...ma,...mb),last=Math.max(0,...[...ma.keys()].filter(i=>ma[i]||mb[i]));
  const mname=i=>new Date(2000,(+A.start.slice(5,7)-1+i)%12,1).toLocaleDateString("fr-FR",{month:"short"});
  h+=`<div class="sec">Matchs vus par mois</div><div class="card"><div class="bars">${[...Array(last+1).keys()].map(i=>`<span>${mname(i)}</span><div><div class="bar a"><i style="width:${100*ma[i]/mx}%"></i></div><div class="bar b"><i style="width:${100*mb[i]/mx}%"></i></div></div><span class="muted">${ma[i]} / ${mb[i]}</span>`).join("")}</div><p class="hint"><span class="dot" style="background:var(--accent)"></span> ${esc(A.name)} · <span class="dot" style="background:var(--draw)"></span> ${esc(B.name)}</p></div>`;
  const T=TEAMS(),keys=[...new Set([...Object.keys(a.teams),...Object.keys(b.teams)])];
  if(keys.length)h+=`<div class="sec">Par équipe</div><div class="card" style="padding:0"><table class="tt"><thead><tr><th></th><th>Équipe</th><th class="ca">${esc(A.name)}</th><th class="cb">${esc(B.name)}</th></tr></thead><tbody>${keys.map(k=>{const x=a.teams[k],y=b.teams[k],f=z=>z?`${z.n} · ★${z.nr?fmtN(z.sum/z.nr):"–"}`:"–";return `<tr><td>${crest(k)}</td><td><b>${esc(T[k]?T[k].label||T[k].name:k)}</b></td><td>${f(x)}</td><td class="muted">${f(y)}</td></tr>`}).join("")}</tbody></table></div>`;
  if(a.best||b.best)h+=`<div class="card muted">Meilleur match : ${a.best?`<b style="color:var(--fg)">${esc(title(a.best))}</b> ${stars(a.best.rating)}`:"–"} vs ${b.best?`<b style="color:var(--fg)">${esc(title(b.best))}</b> ${stars(b.best.rating)}`:"–"}</div>`;
  return h+`</div>`}

async function ghRepo(path,opt={},tok=adm&&adm.token){
  const r=await fetch(`https://api.github.com/repos/${D.repo}/${path}`,{method:opt.method||"GET",cache:"no-store",headers:{"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:opt.body?JSON.stringify(opt.body):undefined});
  if(!r.ok){let m="";try{m=(await r.json()).message||""}catch(e){}throw new Error(r.status===401?"jeton refusé ou expiré":r.status===403||r.status===404?"jeton sans le droit nécessaire ("+(m||r.status)+")":"GitHub HTTP "+r.status+(m?" · "+m:""))}
  return r.status===204?{}:r.json()}
async function wfInfo(tok){const j=await ghRepo("actions/workflows",{},tok);const w=(j.workflows||[]).find(x=>/update\.ya?ml$/.test(x.path))||(j.workflows||[])[0];if(!w)throw new Error("robot introuvable");return w}

// --- Lancer le robot (le réactive s'il a été mis en pause par GitHub) ---
let launch={busy:false,at:0,msg:""};
async function launchRobot(){if(!adm||launch.busy)return;launch={busy:true,at:Date.now(),msg:"Lancement…"};render();
  try{const w=await wfInfo();let re="";
    if(w.state&&w.state!=="active"){await ghRepo(`actions/workflows/${w.id}/enable`,{method:"PUT"});re=" (il avait été mis en pause par GitHub : réactivé)"}
    await ghRepo(`actions/workflows/${w.id}/dispatches`,{method:"POST",body:{ref:"main"}});
    launch.msg="Robot lancé"+re+" · les news arrivent dans 1 à 2 min";robot={state:"running",at:Date.now()};render();
    const t0=launch.at-60e3;for(let i=0;i<24;i++){await new Promise(r=>setTimeout(r,15e3));
      try{const runs=(await (await fetch(`https://api.github.com/repos/${D.repo}/actions/runs?per_page=5`,{cache:"no-store"})).json()).workflow_runs||[];
        const mine=runs.find(x=>x.event==="workflow_dispatch"&&Date.parse(x.created_at)>=t0);
        if(mine&&mine.status==="completed"){launch={busy:false,at:0,msg:mine.conclusion==="success"?"":"Le passage du robot a échoué"};await new Promise(r=>setTimeout(r,20e3));load(true);return}}catch(e){}}
    launch={busy:false,at:0,msg:""};load(true)}
  catch(e){launch={busy:false,at:0,msg:"Erreur : "+e.message};render()}}

  try{await ghRepo(`actions/runs/${id}/cancel`,{method:"POST"});launch.msg="Passage bloqué annulé";robot={state:"",at:0};setTimeout(()=>checkRobot(),4e3)}catch(e){launch.msg="Erreur : "+e.message}render()}

   :`<p class="lead" style="margin:0">Colle ici ton jeton GitHub limité au dépôt <b>vestaire</b> (droits Actions et Contents en lecture et écriture). Il reste uniquement sur cet appareil.</p><div class="actions"><input id="admTok" type="password" autocomplete="off" placeholder="github_pat_…" class="in" style="flex:1 1 100%"><button class="btn primary" data-admon="1" ${admInfo.busy?"disabled":""}>${admInfo.busy?"Vérification…":"Enregistrer"}</button></div>`}
   ${admInfo.err?`<p class="hint" style="color:var(--loss)">Erreur : ${esc(admInfo.err)}</p>`:admInfo.ok?`<p class="hint" style="color:var(--win)">${esc(admInfo.ok)}</p>`:""}${launch.msg?`<p class="hint">${esc(launch.msg)}</p>`:""}</div></div>`}
// Applique les changements en attente à sources.json et les envoie sur GitHub en un seul enregistrement
async function sendPending(){if(!adm||!pend.length)return;admInfo={busy:true,err:"",ok:""};render();
  try{const ref=await ghRepo("git/ref/heads/main"),head=ref.object.sha,cm=await ghRepo("git/commits/"+head);
    const cur=await ghRepo("contents/sources.json?ref="+head);const cfg=JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g,"")))));
    const files=[],summary=[];
    for(const p of pend){
      if(p.op==="addSrc"){if(!cfg.sources.some(s=>s.name===p.src.name)){cfg.sources.push(p.src);summary.push("+ source "+p.src.name)}}
      else if(p.op==="delSrc"){cfg.sources=cfg.sources.filter(s=>s.name!==p.name);summary.push("- source "+p.name)}
      else if(p.op==="pauseSrc"){const s=cfg.sources.find(s=>s.name===p.name);if(s){if(p.on===false)s.on=false;else delete s.on;summary.push((p.on===false?"pause ":"reprise ")+p.name)}}
      else if(p.op==="addClub"){if(!cfg.teams.some(t=>t.key===p.team.key)){cfg.teams.push(p.team);summary.push("+ club "+p.team.name)}
        if(p.src&&!cfg.sources.some(s=>s.name===p.src.name))cfg.sources.push(p.src);
        if(p.logo)files.push({path:`site/logos/${p.team.key}.png`,b64:p.logo.split(",")[1]});if(p.wm)files.push({path:`site/logos/wm-${p.team.key}.png`,b64:p.wm.split(",")[1]})}
      else if(p.op==="delClub"){cfg.teams=cfg.teams.filter(t=>t.key!==p.key);cfg.sources=cfg.sources.filter(s=>s.scope!==p.key);summary.push("- club "+p.key)}}
    const json=JSON.stringify(cfg,null,2)+"\n";files.push({path:"sources.json",b64:btoa(unescape(encodeURIComponent(json)))});
    const tree=[];for(const f of files){const bl=await ghRepo("git/blobs",{method:"POST",body:{content:f.b64,encoding:"base64"}});tree.push({path:f.path,mode:"100644",type:"blob",sha:bl.sha})}
    const tr=await ghRepo("git/trees",{method:"POST",body:{base_tree:cm.tree.sha,tree}});
    const nc=await ghRepo("git/commits",{method:"POST",body:{message:"Appli : "+summary.join(", ").slice(0,200),tree:tr.sha,parents:[head]}});
    await ghRepo("git/refs/heads/main",{method:"PATCH",body:{sha:nc.sha}});
    pend=[];savePend();admInfo={busy:false,err:"",ok:"Envoyé ! Le robot repart tout seul ; les changements apparaissent dans 1 à 2 min."};robot={state:"running",at:Date.now()};setTimeout(()=>load(true),150e3)}
  catch(e){admInfo={busy:false,err:e.message,ok:""}}render()}
function loadClubLogo(file){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,256,256);const s=184/Math.max(im.width,im.height);x.drawImage(im,(256-im.width*s)/2,(256-im.height*s)/2,im.width*s,im.height*s);
  const w=document.createElement("canvas");w.width=w.height=300;const y=w.getContext("2d");const s2=300/Math.max(im.width,im.height);y.drawImage(im,(300-im.width*s2)/2,(300-im.height*s2)/2,im.width*s2,im.height*s2);
  ui.draft={...(ui.draft||{}),logo:c.toDataURL("image/png"),wm:w.toDataURL("image/png")};render()};im.src=fr.result};fr.readAsDataURL(file)}
function admClick(b,d){
  if(d.admon){const v=($("admTok")?.value||"").trim();if(v)admSetup(v);return true}
  if(d.admoff){if(!confirm("Retirer le jeton de cet appareil ?"))return true;adm=null;try{localStorage.removeItem(ADM_KEY)}catch(e){}}
  else if(d.launch){launchRobot();return true}
  else if(d.unstick){unstick(d.unstick);return true}
  else if(d.srcnew){ui.draft={for:"club"};ui.view="srcform";$("screen").scrollTop=0}
  else if(d.clubnew){ui.draft={kws:[],color:"#5b8ff0"};ui.view="clubform";$("screen").scrollTop=0}
  else if(d.dfor){ui.draft={...(ui.draft||{}),for:d.dfor}}
  else if(d.dclub){ui.draft={...(ui.draft||{}),club:d.dclub}}
  else if(d.dsport){ui.draft={...(ui.draft||{}),ssport:d.dsport}}
  else if(d.dkeep){ui.draft={...(ui.draft||{}),keep:d.dkeep}}
  else if(d.dflt){ui.draft={...(ui.draft||{}),filter:!(ui.draft||{}).filter}}
  else if(d.kwadd){const v=($("kwIn")?.value||"").trim();if(v)ui.draft={...(ui.draft||{}),kws:[...((ui.draft||{}).kws||[]),v]}}
  else if(d.kwdel!==undefined){const k=[...((ui.draft||{}).kws||[])];k.splice(+d.kwdel,1);ui.draft={...ui.draft,kws:k}}
  else if(d.srcadd){const x=ui.draft||{},name=(x.sname||"").trim(),url=(x.surl||"").trim();
    if(!name||!/^https?:\/\//.test(url)){alert("Indique un nom et une adresse qui commence par https://");return true}
    const forClub=(x.for||"club")==="club";if(forClub&&!x.club){alert("Choisis le club.");return true}if(!forClub&&!x.ssport){alert("Choisis le sport.");return true}
    if(D.sources.some(s=>s.name===name)||pend.some(p=>p.src&&p.src.name===name)){alert("Une source porte déjà ce nom.");return true}
    const isFeed=/(rss|feed|atom|\.xml)(\b|$)/i.test(url),src={name,scope:forClub?x.club:"sport:"+x.ssport,site:url,feeds:isFeed?[url]:[]};
    if(forClub&&x.filter)src.filter=true;if(!forClub)src.keep=x.keep||"all";
    pend.push({op:"addSrc",src});savePend();ui.draft=null;ui.view="srcman";$("screen").scrollTop=0}
  else if(d.srcdel){if(!confirm("Supprimer la source « "+d.srcdel+" » ?"))return true;pend=pend.filter(p=>!(p.op==="pauseSrc"&&p.name===d.srcdel));pend.push({op:"delSrc",name:d.srcdel});savePend()}
  else if(d.srcpause){const s=D.sources.find(x=>x.name===d.srcpause),ex=pendOf("pauseSrc",d.srcpause);if(ex){pend=pend.filter(p=>p!==ex)}else pend.push({op:"pauseSrc",name:d.srcpause,on:s&&s.status==="pause"?true:false});savePend()}
  else if(d.clubdel){const t=TEAMS()[d.clubdel];if(!confirm(`Retirer ${t?t.name:d.clubdel} et ses sources dédiées ?`))return true;pend.push({op:"delClub",key:d.clubdel});savePend()}
  else if(d.pendundo){const [op,k]=d.pendundo.split("|");pend=pend.filter(p=>!(p.op===op&&(p.name===k||p.key===k||(p.src&&p.src.name===k&&op==="addSrc")||(p.team&&p.team.key===k))));savePend()}
  else if(d.pendclear){if(!confirm("Annuler tous les changements non envoyés ?"))return true;pend=[];savePend()}
  else if(d.pendsend){sendPending();return true}
  else if(d.clubadd){const x=ui.draft||{},name=(x.cname||"").trim(),label=(x.clabel||"").trim();
    if(!x.ssport||!name||!label){alert("Indique le sport, le nom complet et le nom de la pastille.");return true}
    let key=slug(label);const used=new Set([...D.teams.map(t=>t.key),...pend.filter(p=>p.team).map(p=>p.team.key)]);let k2=key,i=2;while(used.has(k2))k2=key.slice(0,6)+i++;key=k2;
    const color=x.color||"#5b8ff0",kw=[...new Set([label,name,...(x.kws||[])])];
    const team={key,name,label,short:label.replace(/[^A-Za-zÀ-ÿ0-9]/g,"").slice(0,3).toUpperCase()||"???",sport:x.ssport,comp:"",theme:{accent:color,bar:hexMix(color,.16)},c1:color,c2:"#ffffff",keywords:kw};
    const src=(x.csrc||"").trim();const ps={op:"addClub",team};
    if(/^https?:\/\//.test(src))ps.src={name:"Site · "+label,scope:key,filter:true,site:src,feeds:/(rss|feed|atom|\.xml)(\b|$)/i.test(src)?[src]:[]};
    if(x.logo){ps.logo=x.logo;ps.wm=x.wm}
    pend.push(ps);savePend();ui.draft=null;ui.view="teamman";$("screen").scrollTop=0}
  else return false;
  render();return true}
document.addEventListener("change",e=>{if(e.target.id==="clubLogo"&&e.target.files[0])loadClubLogo(e.target.files[0]);else if(e.target.id==="clubColor"){ui.draft={...(ui.draft||{}),color:e.target.value};render()}});

function render(){renderTop();const v=ui.view;
  $("app").classList.toggle("notabs",LOGV.includes(v)||ADMV.includes(v));
  $("screen").innerHTML=v==="srcman"?renderSrcMan():v==="teamman"?renderTeamMan():v==="srcform"?renderSrcForm():v==="clubform"?renderClubForm():v==="robotcfg"?renderRobotCfg():v==="saved"?renderSaved():v==="cal"?renderCal():v==="teams"?renderTeams():v==="src"?renderSources():v==="log"?renderLog():v==="logform"?renderLogForm():v==="seasons"?renderSeasons():v==="compare"?renderCompare():v==="look"?renderLook():renderInbox();

document.addEventListener("click",e=>{
  if(e.target.closest("[data-robotcheck]")){load(true);return}
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(b.id==="reload"||d.refresh){load(true);return}
  if(d.syncOn){const v=($("syncTok")?.value||"").trim();if(v)syncSetup(v);return}
  if(d.syncNow){sync();return}
  if(d.syncOff){syncCfg=null;try{localStorage.removeItem(SYNC_KEY)}catch(e){}render();return}
  if(admClick(b,d))return;
  if(logClick(b,d))return;
  if(d.view){ui.view=d.view;ui.open=null;$("screen").scrollTop=0;saveUi()}
  else if(d.sport){ui.sport=d.sport;ui.team="all";saveUi();$("screen").scrollTop=0}
  else if(d.team){ui.team=ui.team===d.team?"all":d.team;saveUi();$("screen").scrollTop=0}
  else if(d.cat){ui.cat=d.cat}
  else if(d.allread){visibleUnread().forEach(a=>P.read.push(a.id));saveP()}
  else if(d.masked){P.rev=[...(P.rev||[]),d.msg];saveP()}
  else if(d.msg){ui.open=d.msg;if(!isRead(d.msg)){P.read.push(d.msg);saveP()}$("sheetBody").scrollTop=0}
  else if(d.close){ui.open=null}
  else if(d.save){const id=ui.open;if(isSaved(id)){P.saved=P.saved.filter(x=>x!==id);delete P.savedItems[id]}else{P.saved.push(id);P.savedItems[id]=findArt(id)}saveP()}
  else if(d.goOrder){ui.view="teams";ui.team="all";ui.reorder=true;ui.hidecfg=false;saveUi();$("screen").scrollTop=0}
  else if(d.goHide){ui.view="teams";ui.team="all";ui.hidecfg=true;ui.reorder=false;saveUi();$("screen").scrollTop=0}
  else if(d.reorder){ui.reorder=!ui.reorder;ui.hidecfg=false}
  else if(d.hidecfg){ui.hidecfg=!ui.hidecfg;ui.reorder=false}
  else if(d.hide){P.hide={...(P.hide||{}),[d.hide]:!P.hide?.[d.hide]};if(!P.hide[d.hide])delete P.hide[d.hide];saveP()}
  else if(d.revteam){ui.revT={...(ui.revT||{}),[d.revteam]:true}}
  else if(d.move){moveTeam(d.move,+d.dir)}
  else if(d.teamOpen){const t=TEAMS()[d.teamOpen];ui.open=null;ui.view="teams";ui.sport=t.sport;ui.team=d.teamOpen;saveUi()}
  else if(b.id==="toggleRead"){isRead(ui.open)?P.read=P.read.filter(x=>x!==ui.open):P.read.push(ui.open);saveP()}
  else return;
  render();
});
async function load(manual){
  loading=true;render();const chk=manual||!robot.at||Date.now()-robot.at>5*6e4;
  try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);D=await r.json();loaded=true;loadErr=null;LS("vh-cache",D)}
  catch(err){loadErr=err.message;const c=LS("vh-cache");if(c&&!loaded){D=c;loaded=true}}
  loading=false;render();
  if(chk)checkRobot();
  if(loaded)sync();
}
