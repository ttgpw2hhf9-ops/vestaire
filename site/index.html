<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15233a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Vestiaire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<title>Le Vestiaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}

/* Layout: phone-first single column — app bar, sport tabs + team chips, scrolling screen, bottom tab bar; message opens as a full-screen sheet. On a desktop the same phone column is centred. */
:root{
  --outer:#dfe4ec; --bg:#eef1f5; --panel:#ffffff; --panel-2:#f4f6f9; --line:#dde2ea;
  --fg:#16202e; --muted:#5d6b7e; --accent:#1f5fd1; --accent-ink:#ffffff;
  --bar:#15233a; --bar-fg:#eef2f8; --bar-muted:#93a2b8;
  --win:#1f8a4c; --loss:#c33a3a; --draw:#8a8f99; --warn:#b7791f;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --outer:#070b12; --bg:#0e1522; --panel:#152033; --panel-2:#1a273c; --line:#26354d;
  --fg:#e6ecf5; --muted:#93a1b6; --accent:#5b8ff0; --accent-ink:#0b1220;
  --bar:#0a111c; --bar-fg:#e6ecf5; --bar-muted:#7d8ba1;
  --win:#3fb56f; --loss:#e06363; --draw:#8d95a3; --warn:#e0a54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --outer:#070b12; --bg:#0e1522; --panel:#152033; --panel-2:#1a273c; --line:#26354d;
  --fg:#e6ecf5; --muted:#93a1b6; --accent:#5b8ff0; --accent-ink:#0b1220;
  --bar:#0a111c; --bar-fg:#e6ecf5; --bar-muted:#7d8ba1;
  --win:#3fb56f; --loss:#e06363; --draw:#8d95a3; --warn:#e0a54a; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--outer);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{position:relative;display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.18)}}

/* app bar */
.top{background:var(--bar);color:var(--bar-fg);flex:none}
.appbar{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.brand{flex:1;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:.04em;text-transform:none;color:var(--bar-muted);margin-left:6px;vertical-align:middle}
.spoil{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:18px;background:rgba(255,255,255,.08);font-size:12px;color:var(--bar-fg)}
.spoil[aria-pressed="true"]{background:rgba(255,255,255,.16)}
.spoil svg{width:18px;height:18px}
.spoil{white-space:nowrap;flex:none}
a.spoil{text-decoration:none}
.spoil[hidden]{display:none}
.spoil[disabled]{opacity:.45;cursor:default}
.brand{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:9px;flex:none}
.brand span{overflow:hidden;text-overflow:ellipsis}
.spoil .lbl{display:none}.spoil{padding:0;width:38px;justify-content:center}
@media (max-width:360px){.brand{font-size:20px}.brand img{width:30px;height:30px}}
.appbar{gap:8px}
.spoil .cnt{font-family:var(--f-mono);font-size:10px;min-width:18px;padding:1px 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);text-align:center}

.sports{display:flex;gap:2px;padding:6px 9px 0;overflow-x:auto;scrollbar-width:none}
.sports::-webkit-scrollbar,.teams::-webkit-scrollbar,.cats::-webkit-scrollbar{display:none}
.sport{flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 7px;border-bottom:3px solid transparent;color:var(--bar-muted);font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.sport[aria-pressed="true"]{color:var(--bar-fg);border-bottom-color:var(--accent)}
.sport .n{font-family:var(--f-mono);font-size:9px;font-weight:500;letter-spacing:0;min-width:16px;padding:1px 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);text-align:center}

.teams{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;background:var(--panel);border-bottom:1px solid var(--line)}
.teams:empty{display:none}
.team{flex:none;display:flex;align-items:center;gap:7px;min-height:38px;padding:4px 12px 4px 5px;border-radius:20px;border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.team.allbtn{padding-left:12px}
.team[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.team .crest{width:28px;height:28px;border-radius:50%}

.crest{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:11px;color:#fff;background:linear-gradient(135deg,var(--c1) 0 62%,var(--c2) 62% 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.crest.lg{width:48px;height:48px;border-radius:12px;font-size:18px}

/* screen */
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cats{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:2;background:var(--bg)}
.chip{flex:none;min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 16px 6px}
.msg{display:grid;grid-template-columns:30px 1fr auto;gap:2px 12px;align-items:start;width:100%;text-align:left;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;min-height:64px}
.msg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c1)}
.msg:active{background:var(--panel-2)}
.msg .body{min-width:0}
.msg .from{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg .subj{display:block;margin-top:2px;font-weight:500;line-height:1.3}
.msg.unread .subj{font-weight:600}
.msg.unread .from::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.msg time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tag{white-space:nowrap;font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.tag.news{color:var(--loss)} .tag.resultat{color:var(--win)} .tag.transfert{color:var(--warn)} .tag.avant-match{color:var(--accent)} .tag.resume{color:var(--fg)} .tag.lang{color:var(--muted);margin-left:4px} .tag.abo{color:#b8860b}
.empty{padding:32px 16px;color:var(--muted);text-align:center}

.pad{padding:4px 16px 24px}
.h2{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:14px 0 4px}
.lead{color:var(--muted);font-size:13px;margin:0 0 12px}
.sec{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.card h4{margin:0 0 10px;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;gap:12px;align-items:center}
.head .t{font-weight:600}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.comp{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.fixture .side{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;min-width:0}
.fixture .mid{font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.fixture .mid small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);margin-top:4px}
.masked{display:inline-block;padding:0 6px;border-radius:4px;background:var(--panel-2);border:1px dashed var(--line);color:var(--muted);font-family:var(--f-mono);font-size:12px;letter-spacing:.1em}
.hidden-note{padding:12px 14px;border-radius:10px;background:var(--panel-2);border:1px dashed var(--line);color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:12px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.form{display:flex;gap:4px}
.form i{font-style:normal;width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:500;color:#fff}
.form .W{background:var(--win)} .form .L{background:var(--loss)} .form .D{background:var(--draw)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions .btn{flex:1 1 auto}
textarea,.field input,.field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit;font-size:16px}
textarea{min-height:90px;margin-top:8px;resize:vertical}
.saved{font-size:13px;color:var(--win);margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-family:var(--f-mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
tr.me td{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:600}
.cal-row{display:grid;grid-template-columns:52px 30px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cal-row .when{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.cal-row .what{min-width:0}
.cal-row .what b{font-weight:600;font-size:14px}
.cal-row .what div{font-size:12px;color:var(--muted)}
.src-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.src-row:first-of-type{border-top:0}
.src-row.off .src-main{opacity:.45}
.src-main{flex:1;min-width:0}
.src-main b{font-weight:600}
.src-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.rel{font-size:11px;color:var(--muted)} .rel.haute{color:var(--win)} .rel.faible{color:var(--warn)}
.keep{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.kbtn{min-height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.kbtn[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.icon-btn{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.icon-btn[disabled]{opacity:.3}
.icon-btn svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.refresh{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.refresh dd{margin:0;font-family:var(--f-mono);font-size:12px}
.demo-note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:16px 0 0}

/* bottom tabs */
.tabbar{flex:none;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);position:relative}
.tabbar button[aria-current="true"]{color:var(--accent);font-weight:600}
.tabbar svg{width:22px;height:22px}
.tabbar .badge{position:absolute;top:6px;left:calc(50% + 6px);font-family:var(--f-mono);font-size:10px;min-width:16px;padding:0 4px;border-radius:8px;background:var(--loss);color:#fff;line-height:16px}

/* message sheet */
.sheet{position:absolute;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:no-preference){.sheet{transition:transform .22s ease,visibility .22s}}
.sheet-bar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 4px;background:var(--panel);border-bottom:1px solid var(--line)}
.back{min-height:44px;padding:0 10px;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:2px}
.back svg{width:20px;height:20px}
.sheet-body{flex:1;overflow-y:auto;padding:16px 16px 32px}
.sheet h2{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.08;margin:14px 0 10px;text-wrap:balance}
.sheet .txt p{margin:0 0 12px}
.save-btn{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--fg)}
.save-btn svg{width:18px;height:18px}
.save-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.msg .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.saved-ico{color:var(--accent);width:16px;height:16px;display:block}
.saved-ico svg{width:16px;height:16px}
.fresh{display:flex;align-items:center;gap:6px;padding:8px 16px 0;font-size:12px;color:var(--muted)}
.fresh svg{width:14px;height:14px;color:var(--win)}
.empty svg{width:36px;height:36px;color:var(--line);display:block;margin:0 auto 8px}
.tabbar .badge.alt{background:var(--accent);color:var(--accent-ink)}
.source{margin-top:16px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.status{display:flex;align-items:flex-start;gap:8px;padding:8px 16px 0;font-size:12px;color:var(--muted)}
.status svg{flex:none;width:14px;height:14px;margin-top:1px}
.status.ok svg{color:var(--win)}
.status.run{color:var(--accent)}
.status.err{color:var(--loss)}
.status .lnk{color:var(--accent);text-decoration:underline;padding:0;font-size:12px}
.status.ok{align-items:center}
.status [data-allread]{margin-left:auto;white-space:nowrap;min-height:32px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.crest.logo{background:#fff;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.crest.logo img{width:100%;height:100%;object-fit:contain;display:block}
.inline-form{display:flex;flex-direction:column;gap:2px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);margin:4px 0 10px}
.check input{width:20px;height:20px}
.danger{color:var(--loss)}
.txt p{margin:0 0 12px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.screen{overflow-x:hidden}
.kv dd,.kv dt{min-width:0;overflow-wrap:anywhere}
.card{min-width:0;max-width:100%}
.head>div{min-width:0}
.head button{padding:0;border-radius:12px}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="appbar">
      <div class="brand"><img src="icon-192.png?v=2" alt=""><span>Le Vestiaire</span></div>
      <a class="spoil" id="journal" target="_blank" rel="noopener" hidden></a><button class="spoil" id="allread" data-allread="1"></button><button class="spoil" id="reload" aria-label="Actualiser"></button>
    </div>
    <nav class="sports" id="sports" aria-label="Sport"></nav>
  </header>
  <div class="teams" id="teams" role="group" aria-label="Équipe"></div>
  <main class="screen" id="screen"></main>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <section class="sheet" id="sheet" aria-label="Message" aria-hidden="true">
    <div class="sheet-bar"><button class="back" data-close="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>Retour</button><span style="flex:1"></span><span id="sheetSave"></span></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<script>
// ===== Vestiaire — version GitHub (sans IA). Lit data.json, mis à jour par GitHub Actions. =====
const CATS={news:"News","avant-match":"Avant-match",resultat:"Résultat",transfert:"Mercato"};
const SPORT_ORDER=["Basket","Foot","Baseball","Rugby","F1","Cyclisme"];
const BADGE={Basket:["BSK","#c4561c","#2a2a2a"],Foot:["FOO","#1d7a3e","#e8e8e8"],Baseball:["BSB","#23395d","#b0262c"],Rugby:["RUG","#7a1f2b","#e8e8e8"],F1:["F1","#d0021b","#1a1a1a"],Cyclisme:["VÉLO","#e0a800","#1a1a1a"]};
let D={teams:[],articles:[],teamData:{},sources:[],dataStatus:{},updatedAt:null}, loaded=false, loadErr=null, loading=false;
const ui={view:"inbox",sport:"all",team:"all",cat:"all",open:null};
let P={read:[],saved:[],savedItems:{},order:[]};
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
Object.assign(ui,LS("vh-ui")||{});ui.open=null;Object.assign(P,LS("vh-prefs")||{});
const saveUi=()=>LS("vh-ui",{sport:ui.sport,team:ui.team,view:ui.view});
const saveP=()=>{const ids=new Set(D.articles.map(a=>a.id));if(D.articles.length)P.read=P.read.filter(i=>ids.has(i));LS("vh-prefs",P)};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TEAMS=()=>Object.fromEntries(D.teams.map(t=>[t.key,t]));
function sports(){const s=new Set([...D.teams.map(t=>t.sport),...D.sources.filter(x=>x.scope.startsWith("sport:")).map(x=>x.scope.slice(6))]);return [...SPORT_ORDER.filter(x=>s.has(x)),...[...s].filter(x=>!SPORT_ORDER.includes(x)).sort()]}
const sportAll=s=>"Tout le "+s.toLowerCase();
// Ordre des équipes choisi par l'utilisateur (gardé sur l'appareil)
const ordered=()=>{const o=P.order||[];return [...D.teams].sort((a,b)=>{const ia=o.indexOf(a.key),ib=o.indexOf(b.key);return (ia<0?999:ia)-(ib<0?999:ib)||D.teams.indexOf(a)-D.teams.indexOf(b)})};
const teamsOf=sp=>ordered().filter(t=>sp==="all"||t.sport===sp).map(t=>t.key);
function moveTeam(k,dir){const t=TEAMS()[k];const same=teamsOf(t.sport);const i=same.indexOf(k),j=i+dir;if(j<0||j>=same.length)return;
  const all=ordered().map(x=>x.key);const a=all.indexOf(k),b=all.indexOf(same[j]);[all[a],all[b]]=[all[b],all[a]];P.order=all;saveP()}

const sportOf=a=>{const t=TEAMS()[a.team];return t?t.sport:a.sport};
function inScope(a){if(isSrc())return a.source===ui.team.slice(4)&&(ui.sport==="all"||sportOf(a)===ui.sport);if(!a.team||!TEAMS()[a.team])return ui.team==="all"&&(ui.sport==="all"||ui.sport===a.sport);return scopeKeys().includes(a.team)}

const TZ="Europe/Paris";
const dayKey=d=>new Date(d).toLocaleDateString("fr-CA",{timeZone:TZ});
function dayLabel(iso){const k=dayKey(iso),t=dayKey(Date.now());if(k===t)return "Aujourd'hui";if(k===dayKey(Date.now()-864e5))return "Hier";if(k===dayKey(Date.now()+864e5))return "Demain";return new Date(iso).toLocaleDateString("fr-FR",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"})}
const hm=iso=>new Date(iso).toLocaleTimeString("fr-FR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});

function crest(key,cls=""){const t=TEAMS()[key];
  const fb=t?`<span class="crest ${cls}" style="--c1:${esc(t.c1)};--c2:${esc(t.c2)}" aria-hidden="true">${esc(t.short)}</span>`:`<span class="crest ${cls}" style="--c1:#55657d;--c2:#8796ad" aria-hidden="true">★</span>`;
  if(!t)return fb;
  return `<span class="crest logo ${cls}" data-fb="${esc(key)}" aria-hidden="true" hidden><img src="logos/${esc(key)}.png" alt="" onload="this.parentNode.hidden=false;this.parentNode.nextElementSibling.remove()" onerror="this.parentNode.remove()"></span>${fb}`}
const srcSlug=n=>"src-"+n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
// Logo d'un site (logos/src-<nom>.png), sinon pastille en lettres
function srcCrest(name,fb,cls=""){return `<span class="crest logo ${cls}" aria-hidden="true" hidden><img src="logos/${srcSlug(name)}.png" alt="" onload="this.parentNode.hidden=false;this.parentNode.nextElementSibling.remove()" onerror="this.parentNode.remove()"></span>${fb}`}
function aCrest(a,cls=""){if(a.team&&TEAMS()[a.team])return crest(a.team,cls);const b=BADGE[a.sport]||[(a.sport||"★").slice(0,3).toUpperCase(),"#55657d","#8796ad"];const fb=`<span class="crest ${cls}" style="--c1:${b[1]};--c2:${b[2]}" aria-hidden="true">${esc(b[0])}</span>`;return D.sources.some(x=>x.chip&&x.name===a.source)?srcCrest(a.source,fb,cls):fb}
const aColor=a=>{const t=TEAMS()[a.team];return t?t.c1:(BADGE[a.sport]||[0,"#55657d"])[1]};

const visibleUnread=()=>D.articles.filter(a=>!isRead(a.id)&&inScope(a)&&(ui.view!=="inbox"||ui.cat==="all"||a.cat===ui.cat));

function renderCal(){
  const T=TEAMS(),rows=[];
  scopeKeys().forEach(k=>((D.teamData[k]||{}).next||[]).forEach(g=>{if(Date.parse(g.date)>Date.now()-3*36e5)rows.push({...g,team:k})}));
  rows.sort((a,b)=>Date.parse(a.date)-Date.parse(b.date));
  let h=`<div class="pad"><h2 class="h2">Agenda</h2><p class="lead">Heure de Paris.</p>`;
  if(!rows.length)return h+`<p class="empty">Aucun match connu pour cette sélection.</p></div>`;
  let last="";for(const g of rows){const k=dayKey(g.date);if(k!==last){h+=`<div class="sec">${esc(dayLabel(g.date))}</div>`;last=k}
    const me=T[g.team].label||T[g.team].name;h+=`<div class="cal-row"><div class="when">${hm(g.date)}</div>${crest(g.team)}<div class="what"><b>${esc(g.home?me+" – "+g.opp:g.opp+" – "+me)}</b><div>${esc(g.comp||"")}</div></div></div>`}

}

function editUrl(path){if(!D.repo)return null;return `https://github.com/${D.repo}/edit/main/${path}`}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(b.id==="reload"){load();return}
  if(d.view){ui.view=d.view;ui.open=null;$("screen").scrollTop=0;saveUi()}
  else if(d.sport){ui.sport=d.sport;ui.team="all";saveUi();$("screen").scrollTop=0}
  else if(d.team){ui.team=ui.team===d.team?"all":d.team;saveUi();$("screen").scrollTop=0}
  else if(d.cat){ui.cat=d.cat}
  else if(d.allread){visibleUnread().forEach(a=>P.read.push(a.id));saveP()}
  else if(d.msg){ui.open=d.msg;if(!isRead(d.msg)){P.read.push(d.msg);saveP()}$("sheetBody").scrollTop=0}
  else if(d.close){ui.open=null}
  else if(d.save){const id=ui.open;if(isSaved(id)){P.saved=P.saved.filter(x=>x!==id);delete P.savedItems[id]}else{P.saved.push(id);P.savedItems[id]=findArt(id)}saveP()}
  else if(d.reorder){ui.reorder=!ui.reorder}
  else if(d.move){moveTeam(d.move,+d.dir)}
  else if(d.teamOpen){const t=TEAMS()[d.teamOpen];ui.open=null;ui.view="teams";ui.sport=t.sport;ui.team=d.teamOpen;saveUi()}
  else if(b.id==="toggleRead"){isRead(ui.open)?P.read=P.read.filter(x=>x!==ui.open):P.read.push(ui.open);saveP()}
  else return;
  render();
});
async function load(){
  loading=true;render();
  try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);D=await r.json();loaded=true;loadErr=null;LS("vh-cache",D)}
  catch(err){loadErr=err.message;const c=LS("vh-cache");if(c&&!loaded){D=c;loaded=true}}
  loading=false;render();
}
const cached=LS("vh-cache");if(cached){D=cached;loaded=true}
render();load();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&D.updatedAt&&Date.now()-Date.parse(D.updatedAt)>20*60e3)load()});
</script>
</body>
</html>
